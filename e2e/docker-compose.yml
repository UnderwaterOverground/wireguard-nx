# Local WireGuard network for end-to-end tests: two stock peers
# (wireguard-go) with echo services, and the wgnx client built for Linux.
# setup.sh generates the keys and .conf files under state/.
name: wgnx-e2e

networks:
  wgnx:
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  # The server most tests talk to: wg 10.7.0.1, UDP 51820, with every
  # client from state/keys.txt as a peer.
  peer:
    build: { context: ., dockerfile: Dockerfile.peer }
    image: wgnx-e2e-peer
    volumes:
      - ./state/wg0.conf:/etc/wireguard/wg0.conf:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN]
    networks:
      wgnx:
        ipv4_address: 172.31.0.20
        aliases: [wg-server]
    profiles: [peer]

  # A second server (wg 10.7.0.9) for the several-peers test.
  peer2:
    image: wgnx-e2e-peer
    volumes:
      - ./state/wg0-peer2.conf:/etc/wireguard/wg0.conf:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN]
    networks:
      wgnx:
        ipv4_address: 172.31.0.21
    depends_on: [peer]
    profiles: [peer]

  # HTTP (8080) and iperf3 (5201) servers inside peer's network namespace,
  # reachable on its tunnel address (and its real one, for pass-through).
  web:
    image: python:3-alpine
    network_mode: service:peer
    command: ["python3", "-m", "http.server", "8080"]
    depends_on: [peer]
    profiles: [peer]

  iperf:
    image: networkstatic/iperf3
    network_mode: service:peer
    command: ["-s"]
    depends_on: [peer]
    profiles: [peer]

  # wgnx-host built for Linux and run on the compose network.
  # Build:  docker compose run --rm wgnx-build
  # Run:    docker compose run --rm wgnx up --conf /state/client.conf ...
  wgnx-build:
    image: wgnx-e2e-client
    build: { context: ., dockerfile: Dockerfile.client }
    working_dir: /src
    volumes:
      - ..:/src
      - wgnx-cargo:/usr/local/cargo/registry
    environment:
      CARGO_TARGET_DIR: /src/target/linux
    entrypoint: ["/src/e2e/build-linux.sh"]
    profiles: [wgnx]

  wgnx:
    image: wgnx-e2e-client
    build: { context: ., dockerfile: Dockerfile.client }
    working_dir: /src
    volumes:
      - ..:/src:ro
      - ./state:/state
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    entrypoint: ["/src/target/linux/bin/wgnx-host"]
    cap_add: [NET_ADMIN]
    networks:
      wgnx:
        ipv4_address: 172.31.0.30
    profiles: [wgnx]

volumes:
  wgnx-cargo:
