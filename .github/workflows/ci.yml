name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test -p wgnx-core
      - name: Unit tests with the Switch's buffer limits
        run: cargo test -p wgnx-core --features switch-limits
      - name: Taildrop file saving
        run: make drop-test
